# Isolated local test project. Not a production configuration.
# The runner replaces PROJECT_ID with a unique ID before starting containers.
project_id = "PROJECT_ID"

[api]
enabled = true
port = 55431
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 55432
shadow_port = 55429
major_version = 17

[db.seed]
enabled = false

[studio]
enabled = false

[realtime]
enabled = false

[storage]
enabled = false

[analytics]
enabled = false

[local_smtp]
enabled = false

[db.pooler]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:55430"
additional_redirect_urls = ["http://127.0.0.1:55430/callback"]
# Short expiry is intentional in this disposable test project only.
jwt_expiry = 60
signing_keys_path = "./signing_keys.json"
enable_signup = false
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 0

[auth.email]
enable_signup = false
enable_confirmations = false

[auth.rate_limit]
token_refresh = 1000
sign_in_sign_ups = 1000

[auth.oauth_server]
enabled = true
authorization_url_path = "/oauth/consent"
allow_dynamic_registration = true

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.charmaine-mcp]
enabled = true
# OAuth discovery must reach the function. The existing OAuth/user middleware
# still validates JWTs; no production middleware is replaced for these tests.
verify_jwt = false
